name: barriodigital-kafka

# 3 Zookeeper + 3 brokers + Kafka UI (seccion 7 y 9 del caso: topicos
# requests.events / audit.timeline con 3 particiones y 3 replicas).
#
# Corre solo en ec2-kafka. Los brokers anuncian KAFKA_PRIVATE_IP:9092/9093/9094
# (puertos publicados en el host) para que apps, en otra EC2, pueda conectarse.
# Requiere kafka/.env con KAFKA_PRIVATE_IP (ver .env.example).
# ponytail: un solo listener anunciando la IP del host; el trafico entre brokers
# tambien pasa por el host. Si molesta, agregar listener INTERNAL para la red docker.

services:
  zk1:
    image: bitnamilegacy/zookeeper:3.9
    restart: unless-stopped
    hostname: zk1
    environment:
      ZOO_SERVER_ID: 1
      ZOO_SERVERS: "zk1:2888:3888,zk2:2888:3888,zk3:2888:3888"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_HEAP_SIZE: 256
    volumes: ["zk1-data:/bitnami/zookeeper"]

  zk2:
    image: bitnamilegacy/zookeeper:3.9
    restart: unless-stopped
    hostname: zk2
    environment:
      ZOO_SERVER_ID: 2
      ZOO_SERVERS: "zk1:2888:3888,zk2:2888:3888,zk3:2888:3888"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_HEAP_SIZE: 256
    volumes: ["zk2-data:/bitnami/zookeeper"]

  zk3:
    image: bitnamilegacy/zookeeper:3.9
    restart: unless-stopped
    hostname: zk3
    environment:
      ZOO_SERVER_ID: 3
      ZOO_SERVERS: "zk1:2888:3888,zk2:2888:3888,zk3:2888:3888"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_HEAP_SIZE: 256
    volumes: ["zk3-data:/bitnami/zookeeper"]

  kafka1:
    image: bitnamilegacy/kafka:3.7
    restart: unless-stopped
    hostname: kafka1
    ports: ["9092:9092"]
    depends_on: [zk1, zk2, zk3]
    environment: &kafka-env
      KAFKA_CFG_ZOOKEEPER_CONNECT: "zk1:2181,zk2:2181,zk3:2181"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_PRIVATE_IP}:9092"
    volumes: ["kafka1-data:/bitnami/kafka"]

  kafka2:
    image: bitnamilegacy/kafka:3.7
    restart: unless-stopped
    hostname: kafka2
    ports: ["9093:9092"]
    depends_on: [zk1, zk2, zk3]
    environment:
      <<: *kafka-env
      KAFKA_CFG_BROKER_ID: 2
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_PRIVATE_IP}:9093"
    volumes: ["kafka2-data:/bitnami/kafka"]

  kafka3:
    image: bitnamilegacy/kafka:3.7
    restart: unless-stopped
    hostname: kafka3
    ports: ["9094:9092"]
    depends_on: [zk1, zk2, zk3]
    environment:
      <<: *kafka-env
      KAFKA_CFG_BROKER_ID: 3
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_PRIVATE_IP}:9094"
    volumes: ["kafka3-data:/bitnami/kafka"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: barriodigital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
    depends_on: [kafka1, kafka2, kafka3]

volumes:
  zk1-data:
  zk2-data:
  zk3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
