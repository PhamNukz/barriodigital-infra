# Config compartida por los 2 nodos: el mismo archivo, bind mount de solo lectura.
#
# Se monta en conf.d/ y no como /etc/rabbitmq/rabbitmq.conf porque el entrypoint
# del image genera configuracion ahi a partir de RABBITMQ_DEFAULT_USER/_PASS. En
# conf.d los fragmentos se mergean en orden lexicografico (primero el
# 10-defaults.conf que trae el image, con loopback_users.guest = false) y nadie
# pisa a nadie.

# Peer discovery. Con 2 nodos fijos y hostnames estables, classic_config alcanza.
# Esto reemplaza el hack de entrypoint (rabbitmq-server -detached; sleep 10;
# join_cluster; tail -f /dev/null) que dejaba tail como PID 1: el contenedor
# seguia reportando Up con el broker muerto y restart: always nunca disparaba.
# ponytail: en produccion el backend seria DNS/K8s/AWS, que no depende del orden
# de arranque -- aqui el orden lo garantiza depends_on.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# ec2-mq es una t3.small (2 GB) con los dos nodos encima. El default de RabbitMQ
# es 0.4 RELATIVO al total visible: cada nodo se creeria dueno de ~800 MB y entre
# los dos dejarian al SO sin aire. 512 MB fijos x 2 = 1 GB.
# Si las colas quorum (A5) hacen alarmar la memoria, este es el numero a mover.
# La alarma bloquea publishers en silencio, por eso check_local_alarms esta en la
# verificacion del README.
vm_memory_high_watermark.absolute = 512MB

# Cuanto espera un nodo virgen buscando a su par antes de seguir como standalone.
# Los defaults (30 intentos x 1s + timeout de cada ping = ~5.5s c/u) se traducen
# en 167 s MEDIDOS de arranque, porque el nodo 1 busca al nodo 2 mientras el
# depends_on le impide existir hasta que el nodo 1 este healthy. Esa espera es
# inevitable por diseno, pero no hace falta que dure 3 minutos: el nodo 1 nunca
# va a encontrar al 2 en el primer arranque, y el nodo 2 lo encuentra al primer
# intento porque arranca despues.
# No bajar de ~5: si alguna vez se arranca sin depends_on, esto es lo unico que
# le da tiempo al par a aparecer.
cluster_formation.discovery_retry_limit = 5
cluster_formation.discovery_retry_interval = 2000
