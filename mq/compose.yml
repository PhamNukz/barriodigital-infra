name: barriodigital-mq

# Cluster de 2 nodos para las evaluaciones (seccion 7 del caso). El cluster se
# forma solo: rabbitmq.conf declara los dos nodos con peer discovery
# classic_config y se monta igual en ambos contenedores.
#
# Corre solo en ec2-mq; apps lo alcanza por la IP privada (RABBITMQ_HOST).
# Arranque, credenciales y verificacion: ../README.md

x-rabbit: &rabbit
  image: rabbitmq:3.13-management
  restart: always # a proposito, no cambiar a unless-stopped (ver README)
  environment:
    # Sin valor por defecto a proposito: si falta mq/.env, compose falla aca en
    # vez de arrancar en silencio con guest/guest y la cookie del repo. Ojo que
    # tambien hace fallar down/ps/logs, que interpolan igual.
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?falta mq/.env - copialo de mq/.env.example}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?falta mq/.env - copialo de mq/.env.example}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?falta mq/.env - copialo de mq/.env.example}
  healthcheck:
    # check_running y no ping: ping solo confirma que la VM de Erlang respira,
    # que es justo el falso positivo que producia el entrypoint viejo.
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 15s
    timeout: 10s
    retries: 5
    # 120s y no 60: el arranque en frio medido fue de 177s con los defaults de
    # discovery (ver rabbitmq.conf), y con el retry acotado baja a ~40s. Un
    # start_period generoso es gratis: un check exitoso marca healthy al toque,
    # solo cambia cuanto se toleran las fallas mientras el broker bootea.
    start_period: 120s

services:
  rabbitmq1:
    <<: *rabbit
    hostname: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI nodo 1
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

  rabbitmq2:
    <<: *rabbit
    hostname: rabbitmq2
    ports:
      - "5673:5672"
      - "15673:15672" # Management UI nodo 2
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    # Con classic_config el orden de arranque decide quien forma el cluster y
    # quien se suma, asi que el nodo 2 espera a que el 1 este sirviendo.
    # Ojo: depends_on es cosa de "compose up". Al revivir el daemon (ciclo
    # stop/start del Learner Lab) los dos arrancan a la vez, y eso es inofensivo
    # SOLO con el cluster ya formado, porque la membresia esta en disco y se
    # saltan el peer discovery. El primer arranque va si o si por compose up.
    depends_on:
      rabbitmq1:
        condition: service_healthy

volumes:
  rabbitmq1-data:
  rabbitmq2-data:
